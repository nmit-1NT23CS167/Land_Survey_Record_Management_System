<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Land Survey Record</title>
    <link rel="stylesheet" href="lands.css">
</head>
<body>
    <div class="cx">
        <div id="Head">
            <h1>Intelligent Land Survey Record Management System</h1>
        </div>
        <form action="/search" method="post">
            <div class="form_control">
                <h2>Search For Land Records</h2>

                <label for="survey_number">Plot Number:</label>
                <input type="text" id="sn1" name="plot_number" placeholder="Enter Plot number" />
                <br /><br />
                
                <label for="owner_name">Owner Name:</label>
                <input type="text" id="own1" name="owner_name" />
                <br /><br />
                
                <label for="area">Area:</label>
                <input type="text" id="a1" name="area" />
                <br /><br />

                <label for="state">State:</label>
                <input type="text" id="state" name="state" />
                <br /><br />

                <label for="Country">Country:</label>
                <input type="text" id="country" name="country" />
                <br /><br />
                
                <label for="date">Date:</label>
                <input type="date" id="date" name="date" />
                <br /><br />
                
                <div class="button">
                    <button type="submit">Apply Search</button>
                </div>
            </div>
        </form>

        <div class="form_control">
            <form action="/insert" method="post">
                <h2>Insert a New Survey Record</h2>

                <label for="survey_number">Plot Number:</label>
                <input type="text" id="sn2" name="plot_number" required />
                <br /><br />

                <label for="owner_name">Owner Name:</label>
                <input type="text" id="own2" name="owner_name" required />
                <br /><br />

                <label for="area">Area:</label>
                <input type="text" id="a2" name="area" required />
                <br /><br />

                <label for="lat">Latitude:</label>
                <input type="text" id="lat" name="lat" required />
                <br /><br />

                <label for="lgn">Longitude:</label>
                <input type="text" id="lng" name="lng" required />
                <br /><br />

                <label for="state">State:</label>
                <input type="text" id="state2" name="state" />
                <br /><br />

                <label for="Country">Country:</label>
                <input type="text" id="country2" name="country" />
                <br /><br />

                <label for="date">Date:</label>
                <input type="date" id="date" name="date" required />
                <br /><br />

                <div class="button">
                    <button type="submit">Apply</button>
                </div>
            </form>
</div>
            <!-- Update Form -->
        <form action="/update" method="post">
            <div class="form_control">
                <h2>Update Existing Land Record</h2>

                <label for="update_plot_number">Plot Number (to update):</label>
                <input type="text" id="update_plot_number" name="plot_number" required/><br><br>

                <label for="update_owner_name">New Owner Name:</label>
                <input type="text" id="update_owner_name" name="owner_name"/><br><br>

                <label for="update_area">New Area:</label>
                <input type="text" id="update_area" name="area"/><br><br>

                <label for="update_lat">New Latitude:</label>
                <input type="text" id="update_lat" name="lat"/><br><br>

                <label for="update_lng">New Longitude:</label>
                <input type="text" id="update_lng" name="lng"/><br><br>

                <label for="update_date">New Date:</label>
                <input type="date" id="update_date" name="date"/><br><br>

                <div class="button">
                    <button type="submit">Update</button>
                </div>
                <br><br>
            </div>
        </form>

        <!-- Delete Form -->
        <form action="/delete" method="post">
            <div class="form_control">
                <h2>Delete Land Survey Record</h2>

                <label for="delete_plot_number">Plot Number (to delete):</label>
                <input type="text" id="delete_plot_number" name="plot_number" required/><br><br>

                <div class="button">
                    <button type="submit" onclick="return confirm('Are you sure you want to delete this record?')">Delete</button>
                </div>
                <br><br>
            </div>
        </form>
        
    </div>
</body>
</html>
